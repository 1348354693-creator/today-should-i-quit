<!doctype html>
<html lang="zh-CN" data-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日宜离职跑路吗</title>
  <link rel="icon" href="data:,">
  <style>/*__REPORT_CSS__*/</style>
</head>
<body>
  <main class="shell">
    <section class="report" id="report" data-round="1" aria-label="薪资评估交互报告">
      <header class="topbar">
        <div class="brand">
          <strong>今日宜离职跑路吗</strong>
          <span>同岗报价、好岗与真话｜最多3轮</span>
        </div>
        <div class="status" id="roundStatus">第1轮</div>
      </header>
      <div class="chat" id="chat" aria-live="polite"></div>
    </section>
  </main>

  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("report-data").textContent);
      const salaryQrDataUri = "__SALARY_QR__";
      const formerColleaguesQrDataUri = "__FORMER_COLLEAGUES_QR__";
      const chat = document.getElementById("chat");
      const report = document.getElementById("report");
      const roundStatus = document.getElementById("roundStatus");
      const jobsById = new Map(data.jobs.map((job) => [job.id, job]));
      const state = { round: 1, firstBranch: null, secondBranch: null, finished: false };

      const create = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      };

      const appendText = (parent, text, strong = false) => {
        parent.appendChild(create(strong ? "strong" : "span", "", text));
      };

      const isHttps = (value) => {
        try { return new URL(value).protocol === "https:"; }
        catch { return false; }
      };

      const addLink = (parent, label, url, className = "") => {
        if (!isHttps(url)) return null;
        const link = create("a", className, label);
        link.href = url;
        parent.appendChild(link);
        return link;
      };

      const addModuleLink = (parent, label, url) => {
        const link = addLink(parent, label, url, "external-link");
        if (link) link.dataset.role = "module-cta";
        return link;
      };

      const addAppModuleEntry = (parent, key, label, url, qrDataUri, desktopCopy, qrAlt) => {
        const desktop = create("div", "app-entry-desktop");
        const content = create("div", "app-entry-content");
        content.appendChild(create("p", "app-entry-copy", desktopCopy));
        const link = addModuleLink(content, label, url);
        if (link) link.classList.add("app-entry-link");
        desktop.appendChild(content);
        const qr = create("img", "app-entry-qr");
        qr.src = qrDataUri;
        qr.alt = qrAlt;
        qr.dataset.entryKey = key;
        desktop.appendChild(qr);
        parent.appendChild(desktop);
      };

      const formatNumber = (value, digits = 1) => {
        const rounded = Number(value.toFixed(digits));
        return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(digits);
      };

      const formatK = (yuan, approximate = false, signed = false) => {
        if (yuan === null || yuan === undefined) return "";
        const value = yuan / 1000;
        const prefix = signed && value > 0 ? "+" : "";
        return `${approximate ? "约" : ""}${prefix}${formatNumber(value)}K`;
      };

      const formatAnnual = (yuan) => {
        const value = yuan / 10000;
        const prefix = value > 0 ? "+" : "";
        return `${prefix}${formatNumber(value)}万元/年`;
      };

      const formatSalary = (job) => {
        const base = `${formatNumber(job.salary_min_yuan / 1000)}-${formatNumber(job.salary_max_yuan / 1000)}K`;
        return job.salary_months ? `${base}·${job.salary_months}薪` : base;
      };

      const formatGapRange = (job) => {
        const current = data.subject.fixed_monthly_salary_yuan;
        const low = job.salary_min_yuan - current;
        const high = job.salary_max_yuan - current;
        return `${formatK(low, false, true)}至${formatK(high, false, true)}`;
      };

      const subjectLine = () => {
        const s = data.subject;
        return `${s.city}｜${s.role}｜${s.experience_years}年｜税前固定月薪${formatK(s.fixed_monthly_salary_yuan)}`;
      };

      const message = (role, speaker, round) => {
        const article = create("article", `message ${role}`);
        article.dataset.round = String(round);
        article.appendChild(create("div", "speaker", speaker));
        const bubble = create("div", "bubble");
        article.appendChild(bubble);
        return { article, bubble };
      };

      const metric = (label, value, isNegative = false) => {
        const item = create("div", "metric");
        item.appendChild(create("div", "metric-label", label));
        item.appendChild(create("div", `metric-value${isNegative ? " negative" : ""}`, value));
        return item;
      };

      const addChoices = (parent, choices) => {
        const box = create("div", "choices");
        choices.forEach((choice, index) => {
          const button = create("button", `choice${index === choices.length - 1 ? " primary" : ""}`, choice.label);
          button.type = "button";
          button.dataset.action = choice.action;
          button.addEventListener("click", () => transition(choice.action));
          box.appendChild(button);
        });
        parent.appendChild(box);
      };

      const renderUserInput = () => {
        const item = message("user", "用户", 0);
        item.bubble.textContent = `${data.subject.city}，${data.subject.role}，${data.subject.experience_years}年，税前固定月薪${formatK(data.subject.fixed_monthly_salary_yuan)}，不包含奖金、补贴、股票或其他收入。`;
        chat.appendChild(item.article);
      };

      const renderRoundOne = () => {
        const item = message("assistant", "Skill｜第1轮", 1);
        item.article.id = "round1";
        item.bubble.appendChild(create("h2", "", data.result.headline));

        const salarySection = create("section", "result-section salary-position-section");
        salarySection.dataset.module = "salary_weekly";
        salarySection.appendChild(create("h3", "result-title", "今日在职性价比"));
        const verdict = create("div", "verdict");
        verdict.appendChild(create("div", "verdict-label", subjectLine()));
        verdict.appendChild(create("div", "verdict-value", data.result.position_label));
        salarySection.appendChild(verdict);

        const metrics = create("div", "metrics salary-metrics");
        metrics.appendChild(metric("当前固定月薪", formatK(data.subject.fixed_monthly_salary_yuan)));
        metrics.appendChild(metric(data.result.average_label, formatK(data.salary_market.average_monthly_yuan, true)));
        metrics.appendChild(metric("月薪参照差额", formatK(data.result.monthly_gap_yuan, true, true), data.result.monthly_gap_yuan < 0));
        metrics.appendChild(metric("按12个月等额差额", formatAnnual(data.result.annual_equal_gap_yuan), data.result.annual_equal_gap_yuan < 0));
        salarySection.appendChild(metrics);
        salarySection.appendChild(create("div", "note", "以上为公开招聘报价参照，不代表实际涨薪或录用结果。"));
        salarySection.appendChild(create("div", "data-note", `数据参考：${data.salary_market.data_scope_label}｜有效样本${data.salary_market.sample_size}个｜核验时间：${data.salary_market.verified_at}`));
        const salaryAction = create("div", "result-action");
        salaryAction.appendChild(create("p", "action-copy", "想知道同城同岗更完整的薪资分布和变化趋势？"));
        addAppModuleEntry(
          salaryAction,
          "salary_weekly",
          data.ctas.salary_weekly.label,
          data.ctas.salary_weekly.url,
          salaryQrDataUri,
          "请使用手机扫码，在脉脉App内查看",
          "脉脉完整薪资周报二维码"
        );
        salarySection.appendChild(salaryAction);
        item.bubble.appendChild(salarySection);

        const highSalarySection = create("section", "result-section high-salary-section");
        highSalarySection.dataset.module = "high_salary_jobs";
        highSalarySection.appendChild(create("h3", "result-title", "高薪的坑位都在挑什么人？"));
        const list = create("ul", "requirements");
        data.high_salary_requirements.slice(0, 3).forEach((requirement) => {
          const li = create("li");
          appendText(li, `${requirement.title}：`, true);
          appendText(li, requirement.requirement);
          list.appendChild(li);
        });
        highSalarySection.appendChild(list);
        const highSalaryAction = create("div", "result-action");
        highSalaryAction.appendChild(create("p", "action-copy", "对照这些要求，看看同城同岗有哪些职位正在给出更高报价。"));
        addModuleLink(highSalaryAction, data.ctas.high_salary_jobs.label, data.ctas.high_salary_jobs.url);
        highSalarySection.appendChild(highSalaryAction);
        item.bubble.appendChild(highSalarySection);
        if (state.round === 1) {
          const continuation = create("section", "continuation");
          continuation.appendChild(create("h3", "result-title", "带薪摸鱼1分钟，继续看看真话与好岗"));
          addChoices(continuation, [
            { label: "1 听同岗同行真话", action: "peer" },
            { label: "2 看今日在招匹配好岗", action: "jobs" }
          ]);
          item.bubble.appendChild(continuation);
        }
        chat.appendChild(item.article);
      };

      const appendPeerContent = (bubble, full, round) => {
        const section = create("section", "result-section peer-section");
        section.dataset.module = "peer_discussions";
        section.appendChild(create("h2", "", `${data.subject.role}同行近期的真实处境与真话`));
        if (!full) {
          const summary = create("div", "branch-summary");
          appendText(summary, "同岗同行真话速览：", true);
          appendText(summary, data.branch_summaries.peer);
          section.appendChild(summary);
        } else {
          data.discussions.forEach((discussion, index) => {
            const post = create("div", "post");
            post.appendChild(create("div", "post-title", `${index + 1}. ${discussion.summary}`));
            if (discussion.is_maimai) addLink(post, "查看原帖", discussion.url);
            section.appendChild(post);
          });
        }
        const action = create("div", "result-action peer-action");
        addModuleLink(action, data.ctas.peer_discussions.label, data.ctas.peer_discussions.url);
        section.appendChild(action);
        bubble.appendChild(section);
      };

      const appendJobsContent = (bubble, full) => {
        const section = create("section", "result-section jobs-section");
        section.dataset.module = "referral_network";
        section.appendChild(create("h2", "", "看今日在招匹配好岗"));
        if (!full) {
          const summary = create("div", "branch-summary");
          appendText(summary, "今日在招匹配好岗速览：", true);
          appendText(summary, data.branch_summaries.jobs);
          section.appendChild(summary);
        } else {
          section.appendChild(create("p", "note", "以下只按城市、岗位和经验做初筛，具体技术与业务门槛需要结合你的真实经历逐项核对。"));
          data.featured_job_ids.map((id) => jobsById.get(id)).filter(Boolean).forEach((job) => {
            const card = create("div", "job");
            card.appendChild(create("div", "job-title", `${job.company}｜${job.title}`));
            card.appendChild(create("div", "job-meta", `${job.location}｜${formatSalary(job)}｜${job.experience}｜月薪区间参照差额${formatGapRange(job)}`));
            card.appendChild(create("p", "job-requirement", `关键门槛：${job.requirements}`));
            if (job.is_maimai) addLink(card, "查看岗位详情", job.source_url);
            section.appendChild(card);
          });
        }
        const action = create("div", "result-action referral-action");
        action.appendChild(create("p", "action-copy", "想进一步接触这些高薪机会，可以去脉脉找工作看看内推机会。"));
        addModuleLink(action, data.ctas.referral_network.label, data.ctas.referral_network.url);
        section.appendChild(action);
        bubble.appendChild(section);
      };

      const renderBranch = (branch, round, withFinal = false) => {
        const item = message("assistant", `Skill｜第${round}轮`, round);
        item.article.dataset.branch = branch;
        if (branch === "peer") appendPeerContent(item.bubble, true, round);
        else appendJobsContent(item.bubble, true);
        if (withFinal) appendFinalCard(item.bubble);
        else if (state.round === 2 && branch === "peer") {
          addChoices(item.bubble, [
            { label: "2 再看今日在招匹配好岗", action: "jobs-after-peer" },
            { label: "3 生成今日跑路可行性诊断卡", action: "finish-from-peer" }
          ]);
        } else if (state.round === 2) {
          addChoices(item.bubble, [
            { label: "1 再听同岗同行真话", action: "peer-after-jobs" },
            { label: "3 生成今日跑路可行性诊断卡", action: "finish-from-jobs" }
          ]);
        }
        chat.appendChild(item.article);
      };

      const appendFinalCard = (bubble) => {
        bubble.appendChild(create("h2", "final-section-heading", "今日跑路可行性诊断卡"));
        const card = create("section", "final-card");
        card.id = "finalCard";
        const head = create("div", "final-card-head");
        const copy = create("div", "final-card-copy");
        copy.appendChild(create("div", "final-card-kicker", subjectLine()));
        copy.appendChild(create("div", "final-card-title", "今日宜离职跑路吗？先看这份行情底牌"));
        copy.appendChild(create("div", "final-card-conclusion", `${data.result.salary_level}；${data.result.position_label}。`));
        head.appendChild(copy);
        card.appendChild(head);

        const salarySection = create("section", "diagnosis-section final-salary-section");
        salarySection.dataset.module = "salary_weekly";
        salarySection.appendChild(create("h3", "diagnosis-title", "今日在职性价比"));
        const metrics = create("div", "metrics");
        metrics.appendChild(metric("当前固定月薪", formatK(data.subject.fixed_monthly_salary_yuan)));
        metrics.appendChild(metric(data.result.average_label, formatK(data.salary_market.average_monthly_yuan, true)));
        metrics.appendChild(metric("月薪参照差额", formatK(data.result.monthly_gap_yuan, true, true), data.result.monthly_gap_yuan < 0));
        salarySection.appendChild(metrics);
        const salaryAction = create("div", "result-action");
        addAppModuleEntry(
          salaryAction,
          "salary_weekly",
          data.ctas.salary_weekly.label,
          data.ctas.salary_weekly.url,
          salaryQrDataUri,
          "请使用手机扫码，在脉脉App内查看",
          "脉脉完整薪资周报二维码"
        );
        salarySection.appendChild(salaryAction);
        card.appendChild(salarySection);

        const highSalarySection = create("section", "diagnosis-section");
        highSalarySection.dataset.module = "high_salary_jobs";
        highSalarySection.appendChild(create("h3", "diagnosis-title", "高薪坑位门槛"));
        highSalarySection.appendChild(create("p", "diagnosis-copy", `高报价方向集中在：${data.high_salary_requirements.slice(0, 3).map((item) => item.title).join("、")}。`));
        const highSalaryAction = create("div", "result-action");
        addModuleLink(highSalaryAction, data.ctas.high_salary_jobs.label, data.ctas.high_salary_jobs.url);
        highSalarySection.appendChild(highSalaryAction);
        card.appendChild(highSalarySection);

        const peerSection = create("section", "diagnosis-section");
        peerSection.dataset.module = "peer_discussions";
        peerSection.appendChild(create("h3", "diagnosis-title", "同岗同行真话"));
        peerSection.appendChild(create("p", "diagnosis-copy", data.branch_summaries.peer));
        const peerAction = create("div", "result-action");
        addModuleLink(peerAction, data.ctas.peer_discussions.label, data.ctas.peer_discussions.url);
        peerSection.appendChild(peerAction);
        card.appendChild(peerSection);

        const referralSection = create("section", "diagnosis-section");
        referralSection.dataset.module = "referral_network";
        referralSection.appendChild(create("h3", "diagnosis-title", "找同岗熟人内推"));
        referralSection.appendChild(create("p", "diagnosis-copy", "想进一步接触这些高薪机会，可以去脉脉找工作看看内推机会。"));
        const referralAction = create("div", "result-action");
        addModuleLink(referralAction, data.ctas.referral_network.label, data.ctas.referral_network.url);
        referralSection.appendChild(referralAction);
        card.appendChild(referralSection);

        const formerSection = create("section", "diagnosis-section");
        formerSection.dataset.module = "former_colleagues";
        formerSection.appendChild(create("h3", "diagnosis-title", "看看前同事去向"));
        formerSection.appendChild(create("p", "former-note", "进入脉脉后，可根据你在脉脉填写的职场资料查看前同事去向；本 Skill 未读取你的脉脉资料，也不在站外预告具体人员、人数或平均薪资。"));
        const formerAction = create("div", "result-action");
        addAppModuleEntry(
          formerAction,
          "former_colleagues",
          data.ctas.former_colleagues.label,
          data.ctas.former_colleagues.url,
          formerColleaguesQrDataUri,
          "请使用手机扫码，在脉脉App内查看",
          "脉脉前同事去向二维码"
        );
        formerSection.appendChild(formerAction);
        card.appendChild(formerSection);
        card.appendChild(create("div", "data-note", "恭喜完成今日“电子裸辞”体验！人可以先继续搬砖，心记得每天过来刷刷同岗新报价和好机会"));
        bubble.appendChild(card);
      };

      const renderFinalOnly = (missingBranch) => {
        const item = message("assistant", "Skill｜第3轮", 3);
        item.article.dataset.branch = "final";
        if (missingBranch === "peer") appendPeerContent(item.bubble, false, 3);
        else appendJobsContent(item.bubble, false);
        appendFinalCard(item.bubble);
        chat.appendChild(item.article);
      };

      const render = () => {
        chat.replaceChildren();
        renderUserInput();
        renderRoundOne();
        if (state.firstBranch && state.round >= 2) renderBranch(state.firstBranch, 2, false);
        if (state.round === 3 && state.secondBranch) renderBranch(state.secondBranch, 3, true);
        else if (state.round === 3 && state.finished) renderFinalOnly(state.firstBranch === "peer" ? "jobs" : "peer");
        report.dataset.round = String(state.round);
        report.dataset.runId = data.run_id;
        roundStatus.textContent = `第${state.round}轮`;
        document.documentElement.dataset.ready = "true";
        if (state.round > 1) {
          requestAnimationFrame(() => {
            const currentMessage = chat.querySelector(
              `.message[data-round="${state.round}"]`
            );
            const scrollToCurrentMessage = () => {
              currentMessage?.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });
            };

            if (currentMessage && getComputedStyle(currentMessage).animationName !== "none") {
              currentMessage.addEventListener("animationend", scrollToCurrentMessage, { once: true });
            } else {
              scrollToCurrentMessage();
            }
          });
        }
      };

      const transition = (action) => {
        if (state.round === 1 && (action === "peer" || action === "jobs")) {
          state.round = 2;
          state.firstBranch = action;
        } else if (state.round === 2 && action === "jobs-after-peer") {
          state.round = 3;
          state.secondBranch = "jobs";
          state.finished = true;
        } else if (state.round === 2 && action === "peer-after-jobs") {
          state.round = 3;
          state.secondBranch = "peer";
          state.finished = true;
        } else if (state.round === 2 && (action === "finish-from-peer" || action === "finish-from-jobs")) {
          state.round = 3;
          state.finished = true;
        } else {
          return;
        }
        render();
      };

      render();
    })();
  </script>
</body>
</html>
